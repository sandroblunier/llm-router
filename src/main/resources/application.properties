# ---------------------------------------------------------------------------
# LLM Router configuration. Every property can be overridden by an environment
# variable: dots and dashes become underscores, upper case
# (e.g. router.kev.url -> ROUTER_KEV_URL).
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.limits.max-body-size=25M
quarkus.http.body.uploads-directory=/tmp/llm-router-uploads
# --- Access ----------------------------------------------------------------
router.api-key.enabled=false
router.api-key.value=${ROUTER_API_KEY:}
# --- Decision model ---------------------------------------------------------
# ollama     = kev model served by Ollama (POST /api/chat, JSON schema + logprobs)
# kev-server = kev Python server (POST /v1/systemone)
router.decision.backend=ollama
# Ollama tag of the kev model -> check with `ollama list`
router.decision.ollama.model=kev
# Context window of the kev model -> check with `ollama show <model>`
router.decision.ollama.num-ctx=8192
router.decision.ollama.reserved-tokens=2048
router.decision.ollama.timeout=60s
router.decision.ollama.top-logprobs=5
# Optional external system prompt; default is the bundled decision-prompt.txt
#router.decision.ollama.prompt-file=/config/decision-prompt.txt
# --- kev server (only for router.decision.backend=kev-server) --------------
router.kev.url=http://host.docker.internal:8009
router.kev.model=kev-latest
router.kev.api-key=${KEV_API_KEY:}
router.kev.timeout=30s
router.kev.max-input-tokens=8192
router.kev.chars-per-token=3.0
# Optional external questions file; default is the bundled kev-questions.json
#router.kev.questions-file=/config/kev-questions.json
# --- Routing ---------------------------------------------------------------
# Privacy levels that may leave the company (comma separated: D0,D1,D2,D3)
router.routing.cloud-allowed-levels=D0
# Cloud only if the summed kev probability of the allowed levels is >= threshold
router.routing.cloud-threshold=0.95
# Complexities that use the cloud when the request is cloud-eligible
router.routing.cloud-complexities=anspruchsvoll
router.routing.pii-threshold=0.5
# --- Target models (all via Ollama) ----------------------------------------
router.models.local-simple=gemma3:4b
router.models.local-medium=gemma3:4b
router.models.local-complex=gemma3:4b
router.models.cloud=gemma4:31b-cloud
router.ollama.url=http://host.docker.internal:11434
router.ollama.timeout=300s
# --- Feedback --------------------------------------------------------------
router.pending.ttl=10m
# --- Log -------------------------------------------------------------------
router.log.file=/data/router-log.jsonl
# --- Dev mode (mvn quarkus:dev): services on localhost ---------------------
%dev.router.kev.url=http://localhost:8009
%dev.router.ollama.url=http://localhost:11434
%dev.router.log.file=data/router-log.jsonl
%dev.router.api-key.value=${ROUTER_API_KEY:dev-key}
# --- Tests: the generic flow tests use the kev-server backend ---------------
%test.router.decision.backend=kev-server
